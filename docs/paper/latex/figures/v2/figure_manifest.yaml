schema_version: 1
updated: 2026-08-10

policy:
  vector_master: svg
  latex_artifact: pdf
  preview_artifact: png
  empirical_values_must_be_loaded: true
  provisional_results_forbidden_in_final: true

figures:
  fig01_system_overview:
    source: sources/fig01_system_overview.py
    outputs:
      - generated/fig01_system_overview.svg
      - generated/fig01_system_overview.pdf
      - generated/fig01_system_overview.png
    kind: conceptual
    empirical_data: none
    status: provisional_structure
    evidence_boundary:
      rf_dpmpp: adopted_foundation
      lqcr: original_confirmed_on_historical_bases_pending_clean_baseline
      ocgr: original_candidate_pending_corrected_paired_seeds
    forbidden_claims:
      - rf_or_dpmpp_invented_here
      - stochot_accuracy_or_stability_gain
      - ocgr_statistically_confirmed

  fig02_lqcr_principle:
    source: sources/fig02_lqcr_principle.py
    outputs:
      - generated/fig02_lqcr_principle.svg
      - generated/fig02_lqcr_principle.pdf
      - generated/fig02_lqcr_principle.png
    kind: theory_mechanism_empirical
    empirical_data:
      - data/source_precision_a4_seed42.json
      - data/source_lqcr_final_only_seed42.json
    status: historical_base_confirmed_pending_clean_baseline
    evidence_boundary:
      probability_factorization: exact
      pq2: monotone_surrogate_not_universal_ap_optimum
      final_only_delta: fixed_seed_causal_ablation
    forbidden_claims:
      - pq2_universally_maximizes_coco_ap
      - quality_oracle_is_a_trained_lqcr_result
      - solver_or_coordinates_changed_in_final_only

  fig04_precision_bottleneck:
    source: sources/fig04_precision_bottleneck.py
    outputs:
      - generated/fig04_precision_bottleneck.svg
      - generated/fig04_precision_bottleneck.pdf
      - generated/fig04_precision_bottleneck.png
    kind: empirical_diagnosis
    empirical_data:
      - data/source_precision_chr2024_seed42_100.json
      - data/source_precision_a4_seed42.json
    status: confirmed_diagnostic
    evidence_boundary:
      dataset1: seed42_100_image_diagnostic
      dataset2: seed42_500_image_diagnostic
      quality_rank: true_iou_oracle_only
    forbidden_claims:
      - oracle_gain_is_achieved_model_gain
      - dataset1_100_image_result_is_full_test_result
