schema_version: 1
updated: 2026-08-10

policy:
  vector_master: svg
  latex_artifact: pdf
  preview_artifact: png
  empirical_values_must_be_loaded: true
  provisional_results_forbidden_in_final: true

figures:
  fig01_system_overview:
    source: sources/fig01_system_overview.py
    outputs:
      - generated/fig01_system_overview.svg
      - generated/fig01_system_overview.pdf
      - generated/fig01_system_overview.png
    kind: conceptual_empirical_hybrid
    empirical_data:
      - ../../../../../data/24_chromosomes_object/coco/valid/_annotations.coco.json
      - ../../../../../experiments/analysis/baseline_vs_sota_cache/24obj_SOTA_seed42_preds.json
    status: confirmed_input_output_with_schematic_path
    evidence_boundary:
      rf_dpmpp: adopted_foundation
      lqcr: original_confirmed_on_historical_bases_pending_clean_baseline
      cascade_interaction: retained_baseline_structure
      actual_elements: input_microscopy_and_final_predictions
      schematic_elements: intermediate_linear_rf_states_and_feature_pyramid
    forbidden_claims:
      - rf_or_dpmpp_invented_here
      - stochot_accuracy_or_stability_gain
      - any_unvalidated_candidate_is_part_of_the_final_model
      - intermediate_states_are_recorded_model_activations

  fig03_lqcr_clean_replication:
    source: sources/fig03_lqcr_clean_replication.py
    outputs:
      - generated/fig03_lqcr_clean_replication.svg
      - generated/fig03_lqcr_clean_replication.pdf
      - generated/fig03_lqcr_clean_replication.png
    kind: empirical_paired_multiseed
    empirical_data:
      - data/source_lqcr_clean_multiseed.json
    status: blocked_on_running_clean_baselines
    evidence_boundary:
      datasets: [Dataset_1]
      seeds: [42, 123, 789]
      intervention: fixed_checkpoint_final_only
      reporting: paired_seed_effect_with_interval
    forbidden_claims:
      - mix_historical_and_clean_checkpoints
      - compare_independently_trained_models_as_lqcr_causal_effect
      - report_mean_without_seed_level_points

  fig05_lqcr_stratified_effect:
    source: sources/fig05_lqcr_stratified_effect.py
    outputs:
      - generated/fig05_lqcr_stratified_effect.svg
      - generated/fig05_lqcr_stratified_effect.pdf
      - generated/fig05_lqcr_stratified_effect.png
    kind: empirical_stratified_paired
    empirical_data:
      - data/source_lqcr_stratified_clean.json
    status: blocked_on_clean_paired_exports
    evidence_boundary:
      strata: [small, medium, large, isolated, near, overlap]
      intervention: same_boxes_classes_coordinates
      primary_question: where_localization_quality_ranking_helps
    forbidden_claims:
      - infer_small_or_overlap_advantage_from_selected_images
      - use_ground_truth_iou_oracle_as_lqcr_result
      - pool_nonpaired_checkpoints

  fig02_lqcr_principle:
    source: sources/fig02_lqcr_principle.py
    outputs:
      - generated/fig02_lqcr_principle.svg
      - generated/fig02_lqcr_principle.pdf
      - generated/fig02_lqcr_principle.png
    kind: theory_mechanism_empirical
    empirical_data:
      - data/source_precision_a4_seed42.json
      - data/source_lqcr_final_only_seed42.json
    status: historical_base_confirmed_pending_clean_baseline
    evidence_boundary:
      probability_factorization: exact
      pq2: monotone_surrogate_not_universal_ap_optimum
      final_only_delta: fixed_seed_causal_ablation
    forbidden_claims:
      - pq2_universally_maximizes_coco_ap
      - quality_oracle_is_a_trained_lqcr_result
      - solver_or_coordinates_changed_in_final_only

  fig04_precision_bottleneck:
    source: sources/fig04_precision_bottleneck.py
    outputs:
      - generated/fig04_precision_bottleneck.svg
      - generated/fig04_precision_bottleneck.pdf
      - generated/fig04_precision_bottleneck.png
    kind: empirical_diagnosis
    empirical_data:
      - data/source_precision_chr2024_seed42_100.json
      - data/source_precision_a4_seed42.json
    status: confirmed_diagnostic
    evidence_boundary:
      dataset1: seed42_100_image_diagnostic
      dataset2: seed42_500_image_diagnostic
      quality_rank: true_iou_oracle_only
    forbidden_claims:
      - oracle_gain_is_achieved_model_gain
      - dataset1_100_image_result_is_full_test_result

  fig06_efficiency:
    source: sources/fig06_efficiency.py
    outputs:
      - generated/fig06_efficiency.svg
      - generated/fig06_efficiency.pdf
      - generated/fig06_efficiency.png
    kind: empirical_efficiency
    empirical_data:
      - data/source_fps_a6000_karyoflow.json
      - data/source_fps_a6000_dino.json
    status: confirmed_same_hardware
    evidence_boundary:
      gpu: NVIDIA_RTX_A6000
      image_size: 512x512
      batch_size: 1
      warmup: 10
      iterations: 500
      map_split: validation
    forbidden_claims:
      - compare_latency_measured_on_different_gpus
      - topk_curve_is_independent_training
      - standard_detectors_are_slower_than_karyoflow

  fig07_qualitative:
    source: sources/fig07_qualitative.py
    outputs:
      - generated/fig07_qualitative.svg
      - generated/fig07_qualitative.pdf
      - generated/fig07_qualitative.png
    kind: qualitative_hybrid_vector
    empirical_data:
      - ../../../../../data/24_chromosomes_object/coco/valid/_annotations.coco.json
      - ../../../../../experiments/analysis/baseline_vs_sota_cache/24obj_SOTA_seed42_preds.json
      - ../../../../../experiments/analysis/baseline_vs_sota_cache/24obj_DiffusionDet_seed42_preds.json
      - ../../../../../experiments/analysis/baseline_inference_24obj_cache/DINO_R50_seed42_preds.json
    status: confirmed_visual_examples
    evidence_boundary:
      dataset: Dataset_2_validation
      image_ids: [1, 2, 4]
      prediction_threshold: 0.30
      vector_elements: boxes_labels_titles
      raster_elements: microscopy_crops
    forbidden_claims:
      - selected_examples_are_an_unbiased_accuracy_estimator
      - omitted_predictions_equal_false_negatives_without_matching
