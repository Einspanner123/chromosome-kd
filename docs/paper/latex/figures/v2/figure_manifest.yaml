schema_version: 2
updated: 2026-08-12

policy:
  vector_master: svg
  latex_artifact: pdf
  preview_artifact: png
  empirical_values_must_be_loaded: true
  held_out_results_only: true

figures:
  fig00_speed_accuracy:
    source: sources/fig00_speed_accuracy.py
    outputs:
      - generated/fig00_speed_accuracy.svg
      - generated/fig00_speed_accuracy.pdf
      - generated/fig00_speed_accuracy.png
    empirical_data:
      - data/source_speed_accuracy_cross_dataset.json
    evidence_scope:
      accuracy: fixed-detector inference means
      latency: same-device forward benchmark
      operating_points: discrete proposal-count settings

  fig01_system_overview:
    source: sources/fig01_system_overview.py
    outputs:
      - generated/fig01_system_overview.svg
      - generated/fig01_system_overview.pdf
      - generated/fig01_system_overview.png
    evidence_scope:
      microscopy_and_output_boxes: representative observations
      intermediate_states: prescribed rectified-flow schematic
      architecture: model-structure schematic

  fig02_lqcr_principle:
    source: sources/fig02_lqcr_principle.py
    outputs:
      - generated/fig02_lqcr_principle.svg
      - generated/fig02_lqcr_principle.pdf
      - generated/fig02_lqcr_principle.png
    empirical_data:
      - data/source_lqcr_test_ap_curve.json
    evidence_scope:
      comparison: paired final-stage ranking on one fixed detector
      quality_score: learned localization-ranking surrogate
      geometry: unchanged before score-dependent selection

  fig07_qualitative:
    source: sources/fig07_qualitative.py
    outputs:
      - generated/fig07_qualitative.svg
      - generated/fig07_qualitative.pdf
      - generated/fig07_qualitative.png
    empirical_data:
      - data/source_small_object_cross_dataset.json
    evidence_scope:
      scale_distribution: all held-out-test annotations
      karyoflow_metrics: three independent detector-pair means
      comparator_metrics: fixed-model point estimates
      ap_small: interpreted within each dataset
