name: test

on:
  pull_request:
    paths-ignore:
      - ".dev_scripts/**"
      - "demo/**"
      - "docker/**"
      - "docs/**"
      - "**.md"
  push:
    branches: [main, master, "experiment/*"]
    paths-ignore:
      - ".dev_scripts/**"
      - "demo/**"
      - "docker/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-cpu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install PyTorch CPU
        run: pip install torch==2.1.0 torchvision==0.16.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install MMCV
        run: pip install -U openmim && mim install mmcv>=2.1.0
      - name: Install mmengine and mmdet
        run: pip install mmengine && pip install --no-build-isolation -e .
        env:
          FORCE_CUDA: "0"
      - name: Import check
        run: |
          python -c "
          import mmdet
          print(f'mmdet version: {mmdet.__version__}')
          from mmdet.utils import register_all_modules
          register_all_modules()
          print('All modules registered successfully')
          "
