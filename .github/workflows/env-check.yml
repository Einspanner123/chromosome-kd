name: env-check

on:
  push:
    paths:
      - "requirements.conda.txt"
      - "requirements/**"
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-conda-env:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: requirements.conda.txt
          activate-environment: chromo
          auto-activate-base: false
      - name: Verify Python version
        run: python -c "import sys; assert sys.version_info >= (3, 10), f'Expected Python >=3.10, got {sys.version}'"
      - name: Verify PyTorch
        run: python -c "import torch; assert torch.__version__.startswith('2.1'), f'Expected PyTorch 2.1.x, got {torch.__version__}'"
      - name: Verify MMCV
        run: python -c "import mmcv; assert mmcv.__version__ >= '2.1.0', f'Expected mmcv >=2.1.0, got {mmcv.__version__}'"
      - name: Verify MMDetection
        run: python -c "import mmdet; print(f'mmdet {mmdet.__version__} OK')"
      - name: Verify key packages
        run: |
          python -c "import numpy; print(f'numpy {numpy.__version__} OK')"
          python -c "import scipy; print(f'scipy {scipy.__version__} OK')"
          python -c "import cv2; print(f'opencv {cv2.__version__} OK')"
          python -c "import timm; print(f'timm {timm.__version__} OK')"
