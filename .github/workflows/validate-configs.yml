name: validate-configs

on:
  pull_request:
    paths:
      - "configs/**"
      - "chromodet/**"
      - "mmdet/**"
  push:
    branches: [main, master, "experiment/*"]
    paths:
      - "configs/**"
      - "chromodet/**"
      - "mmdet/**"
      - ".github/workflows/validate-configs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install PyTorch CPU
        run: pip install torch==2.1.0 torchvision==0.16.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install MMCV
        run: pip install "mmcv>=2.1.0"
      - name: Install runtime dependencies
        run: pip install -r requirements/runtime.txt
      - name: Build and install
        run: pip install -e .
      - name: Validate chromodet configs
        run: |
          python -c "
          from mmengine.config import Config
          import glob, sys

          configs = glob.glob('chromodet/configs/*.py') + glob.glob('configs/_base_/datasets/chromo*.py')
          if not configs:
              print('WARNING: No chromodet configs found')
              sys.exit(0)

          passed = []
          failed = []
          for cfg_path in sorted(configs):
              try:
                  Config.fromfile(cfg_path)
                  passed.append(cfg_path)
                  print(f'  OK: {cfg_path}')
              except FileNotFoundError as e:
                  failed.append((cfg_path, f'Missing base config: {e}'))
                  print(f'  SKIP: {cfg_path} - Missing base config')
              except ImportError as e:
                  failed.append((cfg_path, f'Missing custom module: {e}'))
                  print(f'  SKIP: {cfg_path} - Missing custom module (may be on another branch)')
              except Exception as e:
                  failed.append((cfg_path, str(e)))
                  print(f'  FAIL: {cfg_path} - {e}')

          print(f'\nSummary: {len(passed)} passed, {len(failed)} skipped/failed out of {len(configs)}')

          import_errors = [f for f in failed if 'Missing custom module' in f[1]]
          file_errors = [f for f in failed if 'Missing base config' in f[1]]
          real_errors = [f for f in failed if f not in import_errors and f not in file_errors]

          if real_errors:
              print(f'\n{len(real_errors)} config(s) with real errors:')
              for path, err in real_errors:
                  print(f'  - {path}: {err}')
              sys.exit(1)

          if import_errors:
              print(f'\n{len(import_errors)} config(s) skipped due to missing custom modules (expected if on a feature branch)')
          if file_errors:
              print(f'\n{len(file_errors)} config(s) skipped due to missing base configs (check chromodet/base/ symlink)')
          "
