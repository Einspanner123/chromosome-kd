name: lint

on:
  pull_request:
  push:
    branches: [main, master, "experiment/*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check chromodet/ projects/
      - name: Ruff format check
        run: ruff format --check chromodet/ projects/
