schema_version: 1

postprocess_evaluation: &postprocess_evaluation
  sync:
    required: false
  evidence:
    kind: run_evidence
    path_glob: "{result_root}/**/run_evidence.json"

tasks:
  - task_id: d1-test-sota-dino-seed42-ross
    kind: accuracy_evaluation
    resource_id: ross:a6000:0
    dependencies: [d1-sota-dino-seed42-ross]
    command: &evaluate_command
      - "{python}"
      - tools/experiments/evaluate.py
      - --train-run-id
      - "{train_run_id}"
      - --split
      - test
      - --inference-seed
      - "42"
      - --gpu-id
      - "{gpu_id}"
      - --status
      - paper_eligible
      - --no-import
      - --output-root
      - "{project_root}/{result_root}"
    variables:
      train_run_id: d1-inhouse1700-v2__dino-r50__trainseed-42__4503b53e5ec6
      result_root: results/v2/scheduled_evaluations/d1-test-sota-dino-seed42-ross
