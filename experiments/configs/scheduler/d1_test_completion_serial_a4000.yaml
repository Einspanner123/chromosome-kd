  - '*.pyc'
  - linkst@100.122.196.41:/home/linkst/workspace/chromosome-kd/./tools/experiment_db/experiments.db
  - linkst@100.122.196.41:/home/linkst/workspace/chromosome-kd/./work_dirs/v2/d1_generation/
