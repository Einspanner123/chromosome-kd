schema_version: 1
tasks:
- task_id: d1-test-sync-initial-a4000
  kind: evidence_input_sync
  resource_id: workstation:a4000:1
  dependencies: []
  command:
  - /usr/bin/rsync
  - -a
  - --relative
  - --partial
  - --exclude
  - epoch_*.pth
  - --exclude
  - vis_data/
  - --exclude
  - __pycache__/
