schema_version: 1

postprocess_local: &postprocess_local
  sync:
    required: false
  prepare_command:
    - "{python}"
    - tools/experiments/finalize_external_training.py
    - --work-dir
    - "{work_dir}"
    - --executor
    - "{executor}"
    - --gpu-id
    - "{gpu_id}"
    - --gpu-name
    - "{gpu_name}"
  evidence:
    kind: training_completion
    path: "{work_dir}/training_completion.json"
    executor: "{executor}"
    tracker_run_name: "{tracker_name}"

postprocess_remote: &postprocess_remote
  sync:
    required: true
    source: "{project_root}/{work_dir}"
    destination: "{project_root}/{work_dir}"
    exclude:
      - epoch_*.pth
      - vis_data/
      - __pycache__/
      - '*.pyc'
  prepare_command:
    - "{python}"
    - tools/experiments/finalize_external_training.py
    - --work-dir
    - "{work_dir}"
    - --executor
    - "{executor}"
    - --gpu-id
    - "{gpu_id}"
    - --gpu-name
    - "{gpu_name}"
  evidence:
    kind: training_completion
    path: "{work_dir}/training_completion.json"
    executor: "{executor}"
    tracker_run_name: "{tracker_name}"

tasks:
  - task_id: d1-g0-seed42
    kind: adopted_training
    resource_id: ross:a6000:0
    external_monitor:
      process_pattern: d1_generation/strict_g0_ddpm_linear_scaleshift_r50/trainseed_42/resolved_config.py
    variables:
      work_dir: work_dirs/v2/d1_generation/strict_g0_ddpm_linear_scaleshift_r50/trainseed_42
      executor: ross:a6000:0
      gpu_name: NVIDIA RTX A6000
      tracker_name: d1_generation_strict_g0_ddpm_linear_scaleshift_seed42
    postprocess: *postprocess_local

  - task_id: d1-g1-seed42
    kind: training
    resource_id: ross:a6000:0
    dependencies: [d1-g0-seed42]
    command: &g1_command
      - "{python}"
      - tools/experiments/launch.py
      - --matrix
      - experiments/configs/matrices/d1_inhouse1700_generation_ablation.yaml
      - --method
      - strict_g1_rf_linear_scaleshift
      - --seed
      - "{training_seed}"
      - --executor
      - "{executor}"
      - --gpu-id
      - "{gpu_id}"
      - --launch
    variables:
      training_seed: 42
      work_dir: work_dirs/v2/d1_generation/strict_g1_rf_linear_scaleshift_r50/trainseed_42
      executor: ross:a6000:0
      gpu_name: NVIDIA RTX A6000
      tracker_name: d1_generation_strict_g1_rf_linear_scaleshift_seed42
    postprocess: *postprocess_local

  - task_id: d1-g2-seed42
    kind: training
