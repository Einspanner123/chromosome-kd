schema_version: 1

postprocess_local: &postprocess_local
  sync:
    required: false
  prepare_command:
    - "{python}"
    - tools/experiments/finalize_external_training.py
    - --work-dir
    - "{work_dir}"
    - --executor
    - "{executor}"
    - --gpu-id
    - "{gpu_id}"
    - --gpu-name
    - "{gpu_name}"
  evidence:
    kind: training_completion
    path: "{work_dir}/training_completion.json"
    executor: "{executor}"
    tracker_run_name: "{tracker_name}"

tasks:
  - task_id: d1-sota-dino-seed42-ross
    kind: training
    resource_id: ross:a6000:0
    command: &dino_command
      - "{python}"
      - tools/experiments/launch.py
      - --matrix
      - experiments/configs/matrices/d1_inhouse1700.yaml
      - --method
      - dino_r50
      - --seed
      - "{training_seed}"
      - --executor
      - "{executor}"
      - --gpu-id
      - "{gpu_id}"
      - --launch
    variables:
      training_seed: 42
      work_dir: work_dirs/v2/d1/dino_r50/trainseed_42
      executor: ross:a6000:0
      gpu_name: NVIDIA RTX A6000
      tracker_name: d1_sota_dino_r50_seed42
    postprocess: *postprocess_local

  - task_id: d1-sota-rtmdet-seed42-ross
    kind: training
    resource_id: ross:a6000:0
    dependencies: [d1-sota-dino-seed42-ross]
    command: &rtmdet_command
      - "{python}"
      - tools/experiments/launch.py
      - --matrix
      - experiments/configs/matrices/d1_inhouse1700.yaml
      - --method
      - rtmdet_l
      - --seed
      - "{training_seed}"
      - --executor
      - "{executor}"
      - --gpu-id
      - "{gpu_id}"
      - --launch
    variables:
      training_seed: 42
      work_dir: work_dirs/v2/d1/rtmdet_l/trainseed_42
      executor: ross:a6000:0
      gpu_name: NVIDIA RTX A6000
      tracker_name: d1_sota_rtmdet_l_seed42
    postprocess: *postprocess_local

  - task_id: d1-sota-cascade-seed42-ross
    kind: training
    resource_id: ross:a6000:0
    dependencies: [d1-sota-rtmdet-seed42-ross]
    command: &cascade_command
      - "{python}"
      - tools/experiments/launch.py
      - --matrix
      - experiments/configs/matrices/d1_inhouse1700.yaml
      - --method
      - cascade_rcnn_r50
      - --seed
      - "{training_seed}"
      - --executor
      - "{executor}"
      - --gpu-id
      - "{gpu_id}"
