schema_version: 1
protocol_id: v2.d2.karyoflow.topk_renewal.train3.test
protocol_type: inference_replication
dataset_id: D2
split: test
inference_seed: 42
selection:
  split: val
  test_tuned: false
base:
  matrix: experiments/configs/matrices/d2_taichung.yaml
  method: karyoflow
  config_id: v2.d2.karyoflow_r50.train
  checkpoint_source:
    type: successful_parent_run_registry
    training_seeds: [42, 123, 789]
    require_distinct_checkpoint_sha256: true
intervention:
  scope: model.bbox_head
  factors:
    topk_k: [100, 150, 200, 300, 500]
    box_renewal: [false, true]
  product: true
  derived_overrides:
    topk_pruning_enabled: "topk_k < 500"
    topk_pruning_step: 0
  variant_id: "k{topk_k}_renewal_{box_renewal:on|off}"
evaluation:
  aggregate_unit: independent_training_seed
  expected_evaluations: 30
  required_metrics: [mAP, AP50, AP75, AP_S, AP_M, AP_L]
  persist_predictions: true
