schema_version: 1
inventory_id: d2_paper_all_evidence_v1
authoritative_route_matrix: experiments/manifests/paper_experiment_route_matrix.yaml
scope_note: This inventory is the D2 evidence detail view; scheduling and cross-dataset status are governed by the authoritative route matrix.
dataset:
  id: D2
  split: test
  annotation_sha256: 110fd2804f435b04a1eee969cb28666a0818b2886040a57cbae2dd05f2767495
  images: 1000
  classes: 24

evidence_policy:
  accuracy_gate: split=test and test_tuned=false
  training_replication: aggregate one value per independently trained checkpoint
  inference_replication: fixed checkpoint; never interpreted as training variability
  compatibility_mapping: only EXACT reports receive a canonical v2 config id
  diagnostic_gate: diagnostic results remain paper_eligible=false

paper_units:
  main_generation_comparison:
    paper_location: tab:main-ablation
    evidence_kind: historical_cross_checkpoint_and_fixed_checkpoint
    result_artifact: paper-test-multiseed-92e803b9772e
    variants:
      - id: d2_sota_diffusiondet
        config_state: structural_only
        compatibility_report: tools/experiment_db/compatibility_reports/d2_sota_diffusiondet.json
        limitation: seven derived legacy diffusion-schedule buffers are not registered by the cleaned head
      - id: d2_rf_heun
        config_state: exact
        config_id: v2.d2_history.legacy_rf_heun_pre_adaln_r50.train
        compatibility_report: tools/experiment_db/compatibility_reports/d2_rf_heun_historical.json
      - id: d2_sota_karyoflow
        config_state: exact
        config_id: v2.d2_history.legacy_karyoflow_ot_r50.train
      - id: d2_sota_karyoflow_lqcr
        config_state: exact
        config_id: v2.d2_history.legacy_karyoflow_ot_lqcr_r50.train

  solver_steps:
    paper_location: tab:solver-ablation
    evidence_kind: fixed_checkpoint_inference_ablation
    protocol: experiments/configs/ablations/d2_solver_test.yaml
    variants: 12
    config_state: migrated
    raw_prediction_artifact: d2-inference-predictions-manifest-ecb415fa162a

  topk_renewal:
    paper_location: tab:deployment and fig:speed-accuracy
    evidence_kind: fixed_checkpoint_inference_ablation
    protocol: experiments/configs/ablations/d2_topk_renewal_test.yaml
    variants: 10
    config_state: migrated
    raw_prediction_artifact: d2-inference-predictions-manifest-ecb415fa162a

  lqcr_beta:
    paper_location: tab:lqcr-beta
    evidence_kind: fixed_checkpoint_inference_ablation
    protocol: experiments/configs/ablations/d2_lqcr_beta_test.yaml
    variants: 5
    config_state: migrated

  sota_ours:
    paper_location: tab:sota/Dataset2
    evidence_kind: independent_training_pairs
    artifact: d2-paired-lqcr-train3-4152cdbd5100
    training_seeds: [335778785, 790448076, 1342286018]
    parent_config_id: v2.d2_history.legacy_karyoflow_ot_r50.train
    child_config_id: v2.d2_history.legacy_karyoflow_ot_lqcr_r50.train
    compatibility_reports: tools/experiment_db/compatibility_reports/d2_mainline_history_v1_index.json
    config_state: exact

  sota_fixed_baselines:
    paper_location: tab:sota/Dataset2
    evidence_kind: fixed_checkpoint_inference_replication
    inference_seeds: [42, 123, 789]
    artifact: paper-test-multiseed-92e803b9772e
    variants:
      - d2_sota_dino_r50
      - d2_sota_rtmdet_l
      - d2_sota_cascade_rcnn
      - d2_sota_diffusiondet
      - d2_sota_yolox_s
    config_state: migrated
    exact_variants:
      - d2_sota_dino_r50
      - d2_sota_rtmdet_l
      - d2_sota_cascade_rcnn
      - d2_sota_yolox_s
    structural_only_variants:
      - d2_sota_diffusiondet
    compatibility_index: tools/experiment_db/compatibility_reports/d2_standard_baseline_history_v1_index.json
    diffusiondet_compatibility_report: tools/experiment_db/compatibility_reports/d2_sota_diffusiondet.json

  head_distillation:
    paper_location: tab:deployment
    evidence_kind: single_parent_student_and_fixed_checkpoint_inference
    accuracy_result_id: paper-3iseed-d2_head_student_h3-map
    latency_result_id: distill-d2-student-latency
    inference_config_state: exact
    inference_config_id: v2.d2_history.legacy_karyoflow_ot_h3_student_r50.train
    inference_compatibility_report: tools/experiment_db/compatibility_reports/d2_head_student_h3.json
    historical_training_config_state: archived_non_executable
    historical_training_manifest: experiments/configs/deployment/h3_distillation_training_archive.yaml

  speed_accuracy:
    paper_location: fig:speed-accuracy and tab:deployment
    evidence_kind: hardware_benchmark
    accuracy_family: paper_three_inference_seed_test
    latency_family: speed_accuracy
    config_state: protocol_migrated_historical_measurements_partial
    protocol: experiments/configs/deployment/a6000_speed_protocol.yaml
    limitation: historical measurements lack fixed-clock, environment-hash, and three-rerun evidence required by the new strict protocol

  analysis:
    paper_location: dataset table, SOTA discussion, scale figure, difficulty table
    evidence_kind: deterministic_and_diagnostic_analysis
    reverse_index: tools/experiment_db/manifests/d2_paper_evidence_index.json
    protocols:
      - tools/experiment_db/protocols/test_dataset_properties.json
      - tools/experiment_db/protocols/d2_bootstrap.json
      - tools/experiment_db/protocols/d2_difficulty_strata.json
      - tools/experiment_db/protocols/d2_fixed_checkpoint_inference.json
      - tools/experiment_db/protocols/d2_deployment_benchmark.json
    config_state: migrated

supersedes_for_paper_accuracy:
  - family: LQCR
    split: val
  - family: head_distillation
    split: val
  - family: legacy_protocol
    split: val

remaining_experiments_not_represented_as_completed:
  - strict_generation_ablation_G0_G1_G2_three_training_seeds
  - conventional_baseline_training_seed_replication
  - strict_new_speed_protocol_three_reruns
  - GACS_cross_dataset_deployment
