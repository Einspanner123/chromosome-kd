notes:
  - No training or unified evaluation process was active when baseline was frozen.
  - work_dirs and results remain in place until P5.
  - P1 removed user-owned Python, pytest, Ruff, coverage, and LaTeX caches.
  - Root-owned build/model caches remain ignored and are not used by the project.
  - P2 reduced active tracked configuration files from 277 to 91.
  - Historical inference protocols resolve deleted source configs through the recovery tag.
  - Immutable compatibility report payloads were not rewritten during path migration.
  - P3 reduced the active ldmdet package from 54 to 34 Python files.
  - P3 retained 12 focused test files; all 84 collected tests pass.
  - KaryoFlow, LQCR, and H3 student checkpoints strictly load in the cleaned runtime.
  - P4 established schema-validated, transactional run-evidence import for new results.
  - The canonical database was not rewritten; its SHA-256 stayed fixed during P4.
  - Legacy diagnostic eligibility is documented as a bounded data-quality risk.
  - P5 inventoried 835 GB of non-Git training artifacts and performed no permanent deletion.
  - Runtime roots remain stable because evidence records reference their paths and hashes.
  - P6 removed inactive projects, generated root analysis, and superseded research plans.
  - Five active research documents now define scientific scope and evidence boundaries.
  - Six registered eta_str JSON artifacts retain their historical paths for evidence resolution.
  - Ignored documentation data was moved to the cleanup quarantine, not deleted.
  - P7 replaced 1,777 vendored MMDetection files with the pinned public 3.3.0 package.
  - The discarded local CocoMetric patch affected visualization keys, not aggregate AP.
  - The environment now imports MMDetection from site-packages and builds a KaryoFlow wheel.
  - P8 reduced the active index to 478 files from 2,812 at the recovery ref.
  - Machine-specific queue scripts and duplicate diagnostic runners were retired.
  - Generated analysis caches and root residues were moved to ignored quarantine.
  - The active Python surface passes Ruff formatting, lint, and 92 unit tests.
  - Public release still requires an explicit repository license decision.
