[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 79
target-version = "py38"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C4", "SIM", "TCH", "RUF"]
ignore = [
    "E501",
    "SIM108",
    "RUF001",
    "RUF002",
    "RUF003",
    "C408",
    "E402",
    "F405",
    "F403",
    "RUF013",
    "F841",
    "RUF059",
    "SIM102",
    "E722",
    "SIM105",
]

[tool.ruff.lint.isort]
known-first-party = ["ldmdet", "experiments"]
known-third-party = [
    "PIL",
    "cv2",
    "matplotlib",
    "mmcv",
    "mmdet",
    "mmengine",
    "numpy",
    "pycocotools",
    "pytest",
    "scipy",
    "swanlab",
    "torch",
    "torchvision",
    "yaml",
]
no-lines-before = ["standard-library", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"experiments/configs/*" = ["F401", "F403", "F405"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
